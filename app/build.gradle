plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fixsssator.netscope'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fixsssator.netscope'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('appVersionCode').get().toInteger()
        versionName providers.gradleProperty('appVersionName').get()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
