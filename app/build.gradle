plugins {
    id 'com.android.application'
}

def appVersionNameProp = project.findProperty('appVersionName') ?: '0.4.0'
def appVersionCodeProp = (project.findProperty('appVersionCode') ?: '4').toInteger()

android {
    namespace 'com.fixsssator.netscope'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fixsssator.netscope'
        // minSdk 29: VpnService.Builder#setHttpProxy and ConnectivityManager#getConnectionOwnerUid need API 29.
        minSdk 29
        targetSdk 35
        versionCode appVersionCodeProp
        versionName appVersionNameProp
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // X.509 certificate generation for the local MITM certificate authority
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}

// Name the APK after the version, e.g. NetScope-0.3.0-debug.apk
android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "NetScope-${variant.versionName}-${variant.buildType.name}.apk"
    }
}
